name: Site checks

on:
  push:
  pull_request:
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore generate_feed.cs --force-evaluate --no-http-cache
      - run: dotnet restore sync_csp.cs --force-evaluate --no-http-cache
      - run: dotnet run sync_csp.cs -- --check
      - run: dotnet run tests/site_checks.cs
